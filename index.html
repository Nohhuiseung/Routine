<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일 루틴 캘린더</title>
<style>
  :root{
    --paper:#f7f4ec; --ink:#1d2433; --line:#d9d3c4; --muted:#7a7565;
    --work:#e8eef7; --work-ink:#2f4a7a; --off:#fbf1dc; --off-ink:#8a5a12;
    --done:#2b7a5b; --accent:#c8412b; --card:#fffdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:-.02em}
  h1 span{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
  .nav{display:flex;gap:6px;align-items:center}
  .nav button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .nav button:hover{border-color:var(--ink)}
  .nav .month{font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;min-width:110px;text-align:center}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:18px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
  .day{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:6px;cursor:pointer;position:relative;transition:border-color .15s}
  .day:hover{border-color:var(--ink)}
  .day.other{opacity:.35}
  .day.sel{border:2px solid var(--ink);padding:5px}
  .day.today .num::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
  .num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;margin-top:3px}
  .tag.w{background:var(--work);color:var(--work-ink)}
  .tag.o{background:var(--off);color:var(--off-ink)}
  .dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:2px;background:var(--line)}
  .dot.on{background:var(--done)}
  .fixed-mini{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px;align-self:start}
  .panel h2{margin:0 0 2px;font-size:18px}
  .panel .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sec{margin-top:14px}
  .sec label.title{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;background:#fff;resize:vertical;color:var(--ink)}
  textarea:focus,input:focus{outline:2px solid var(--work-ink);outline-offset:1px}
  .check{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
  .check:hover{background:var(--paper)}
  .check input{width:18px;height:18px;accent-color:var(--done);cursor:pointer}
  .check.done span{color:var(--muted);text-decoration:line-through}
  .check small{color:var(--muted);margin-left:auto;font-size:11px}
  .grp{font-size:11px;color:var(--muted);margin:10px 0 2px 8px}
  .score{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .2s}
  .save{font-size:11px;color:var(--muted);text-align:right;margin-top:10px;min-height:14px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
  .week-summary{margin-top:12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>일일 루틴 <span>계획 · 체크 · 일기</span></h1>
    <div class="nav">
      <button id="prev">‹</button>
      <div class="month" id="monthLabel"></div>
      <button id="next">›</button>
      <button id="todayBtn">오늘</button>
      <button id="exportBtn" title="데이터를 파일로 저장">백업</button>
      <button id="importBtn" title="백업 파일 불러오기">복원</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </header>

  <div class="layout">
    <div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--work)"></i>근무일</span>
        <span><i style="background:var(--off)"></i>휴무일</span>
        <span><i style="background:var(--done)"></i>매일 항목 6개 완료 표시</span>
      </div>
      <div class="week-summary" id="weekSummary"></div>
    </div>

    <aside class="panel" id="panel">
      <h2 id="pTitle">날짜를 선택하세요</h2>
      <div class="sub" id="pSub"></div>
      <div id="pBody" style="display:none">
        <div class="sec">
          <label class="title">고정 일정</label>
          <input type="text" id="fixed" placeholder="합주, 모임, 약속…">
        </div>
        <div class="sec">
          <label class="title">☀️ 아침 계획 (5분)</label>
          <textarea id="plan" rows="3" placeholder="오늘 그날만의 항목 하나 + 더 하고 싶은 것 하나"></textarea>
        </div>
        <div class="sec">
          <label class="title">체크</label>
          <div id="checks"></div>
          <div class="score"><div class="bar"><i id="barFill"></i></div><span id="scoreText">0/6</span></div>
        </div>
        <div class="sec">
          <label class="title">🌙 저녁 일기 (세 줄이면 충분)</label>
          <textarea id="diary" rows="5" placeholder="오늘 있었던 일, 느낀 것, 내일 한 가지"></textarea>
        </div>
        <div class="save" id="saveMsg"></div>
      </div>
    </aside>
  </div>
</div>

<script>
const DAILY=[
  {k:'cat_am',label:'떡국 아침',note:'습식·물그릇·화장실'},
  {k:'cat_pm',label:'떡국 저녁·놀기',note:'습식·15분·양치·눈닦기'},
  {k:'news',label:'도민일보 모니터',note:'20~30분'},
  {k:'drum',label:'드럼',note:'30분'},
  {k:'compose',label:'작곡',note:'20분'},
  {k:'read',label:'독서',note:'30분'},
];
const WEEKLY=[
  {k:'exercise',label:'운동',note:'주 3회'},
  {k:'clean',label:'청소',note:'휴무일'},
  {k:'paper',label:'논문 요약',note:'주 1회'},
];
const DEFAULT_FIXED={
  '2026-08-27':'21:20 노미들 모임',
  '2026-08-28':'19:00 친구 생일잔치',
  '2026-08-29':'13~17 김해 AI작곡수업 · 18:30 봉하음악회',
  '2026-08-30':'15~17 파도뮤직 합주 → 부산',
  '2026-08-31':'부산 여행 · 22:30 취침',
  '2026-09-01':'첫 출근',
  '2026-09-06':'15:00 파도뮤직 합주',
};
const STORE_KEY='routine-days';
const START=new Date(2026,8,1); // 첫 출근 2026-09-01
const WEEK0=new Date(2026,7,31); // 그 주 월요일

let data={}; // {ymd:{fixed,plan,diary,checks:{}}}
let view=new Date(); view.setDate(1);
let selected=ymd(new Date());

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
const DOW=['일','월','화','수','목','금','토'];

function workInfo(d){
  if(d<START) return {work:false,label:'휴무'};
  const diff=Math.floor((d-WEEK0)/86400000); const wk=Math.floor(diff/7);
  const dow=d.getDay(); // 0 일
  const a=wk%2===0; // A주: 화~토, B주: 수~일
  const work=a?(dow>=2&&dow<=6):(dow>=3||dow===0);
  if(!work) return {work:false,label:'휴무'};
  const early=(dow===3||dow===5);
  return {work:true,label:early?'9:00–18:00':'9:30–18:30'};
}

async function load(){
  try{const r=localStorage.getItem(STORE_KEY); if(r) data=JSON.parse(r);}catch(e){data={};}
  render();
}
let saveTimer;
function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('saveMsg').textContent='저장 중…';
  saveTimer=setTimeout(async()=>{
    try{localStorage.setItem(STORE_KEY,JSON.stringify(data));document.getElementById('saveMsg').textContent='저장됨';}
    catch(e){document.getElementById('saveMsg').textContent='저장 실패 — 브라우저 저장소가 막혀 있어요';}
  },500);
}
function entry(k){
  if(!data[k]) data[k]={fixed:DEFAULT_FIXED[k]||'',plan:'',diary:'',checks:{}};
  return data[k];
}
function dailyDone(k){const e=data[k];if(!e)return 0;return DAILY.filter(x=>e.checks[x.k]).length;}

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  document.getElementById('monthLabel').textContent=y+'. '+(m+1);
  const g=document.getElementById('grid'); g.innerHTML='';
  DOW.forEach(d=>{const e=document.createElement('div');e.className='dow';e.textContent=d;g.appendChild(e);});
  const first=new Date(y,m,1); const startOffset=first.getDay();
  const todayK=ymd(new Date());
  for(let i=0;i<42;i++){
    const d=new Date(y,m,1-startOffset+i); const k=ymd(d);
    const cell=document.createElement('div');
    cell.className='day'+(d.getMonth()!==m?' other':'')+(k===selected?' sel':'')+(k===todayK?' today':'');
    const wi=workInfo(d);
    const fixed=(data[k]&&data[k].fixed)||DEFAULT_FIXED[k]||'';
    cell.innerHTML=`<div class="num">${d.getDate()}</div>
      <span class="tag ${wi.work?'w':'o'}">${wi.label}</span>
      <div class="dots">${DAILY.map(x=>`<i class="dot ${data[k]&&data[k].checks[x.k]?'on':''}"></i>`).join('')}</div>
      ${fixed?`<div class="fixed-mini" title="${fixed}">${fixed}</div>`:''}`;
    cell.onclick=()=>{selected=k;render();};
    g.appendChild(cell);
    if(i>=34&&new Date(y,m,1-startOffset+i+1).getMonth()!==m&&d.getMonth()!==m)break;
  }
  renderPanel(); renderWeek();
}

function renderWeek(){
  const d=parse(selected); const dow=(d.getDay()+6)%7; // 월=0
  const mon=new Date(d); mon.setDate(d.getDate()-dow);
  let ex=0,rd=0,paper=0,dsum=0;
  for(let i=0;i<7;i++){const k=ymd(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i));const e=data[k];if(!e)continue;if(e.checks.exercise)ex++;if(e.checks.paper)paper++;if(e.checks.read)rd++;dsum+=dailyDone(k);}
  document.getElementById('weekSummary').textContent=`이번 주(${mon.getMonth()+1}/${mon.getDate()}~) · 운동 ${ex}/3 · 논문 ${paper}/1 · 독서 ${rd}/7 · 매일 항목 ${dsum}/42`;
}

function renderPanel(){
  const d=parse(selected); const wi=workInfo(d); const e=entry(selected);
  document.getElementById('pTitle').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  document.getElementById('pSub').textContent=wi.work?`근무 ${wi.label}`:'휴무';
  document.getElementById('pBody').style.display='block';
  const fx=document.getElementById('fixed'),pl=document.getElementById('plan'),dy=document.getElementById('diary');
  fx.value=e.fixed; pl.value=e.plan; dy.value=e.diary;
  fx.oninput=()=>{e.fixed=fx.value;scheduleSave();};
  pl.oninput=()=>{e.plan=pl.value;scheduleSave();};
  dy.oninput=()=>{e.diary=dy.value;scheduleSave();};
  const c=document.getElementById('checks'); c.innerHTML='';
  const mk=(x)=>{
    const l=document.createElement('label'); l.className='check'+(e.checks[x.k]?' done':'');
    l.innerHTML=`<input type="checkbox" ${e.checks[x.k]?'checked':''}><span>${x.label}</span><small>${x.note}</small>`;
    l.querySelector('input').onchange=(ev)=>{e.checks[x.k]=ev.target.checked;scheduleSave();render();};
    c.appendChild(l);
  };
  const g1=document.createElement('div');g1.className='grp';g1.textContent='매일';c.appendChild(g1);
  DAILY.forEach(mk);
  const g2=document.createElement('div');g2.className='grp';g2.textContent=wi.work?'주간 (근무일엔 운동만 해당)':'주간 · 휴무일';c.appendChild(g2);
  WEEKLY.forEach(mk);
  const n=dailyDone(selected);
  document.getElementById('barFill').style.width=(n/6*100)+'%';
  document.getElementById('scoreText').textContent=`${n}/6`+(n>=4?' · 성공':'');
}

document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);render();};
document.getElementById('todayBtn').onclick=()=>{view=new Date();view.setDate(1);selected=ymd(new Date());render();};
document.getElementById('exportBtn').onclick=()=>{
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='루틴백업_'+ymd(new Date())+'.json';a.click();
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=(ev)=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{data=JSON.parse(r.result);scheduleSave();render();}catch(e){alert('파일을 읽지 못했어요');}}; r.readAsText(f);
};
load();
</script>
</body>
</html>
